{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="box" style="max-width: 360px; margin: 40px auto;">
  <h2>On-call engineer log-in</h2>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <p><label>User name<br><input type="text" name="username" autocomplete="username" required></label></p>
    <p><label>Password<br><input type="password" name="password" autocomplete="current-password" required></label></p>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
